# 从 G1 正式运行实际生效配置复制；不继承 locomanip。
# algorithm、optim 及精度沿用 G1；演示训练 decoder、最后一个 DiT block 和 value head。
# DROID checkpoint 默认 8 次去噪；1056 步 = 33 个 32 步动作块。
# blue_block PPO 演示：2 env × 33 块 / global batch 11 = 每轮 6 次 optimizer 更新。
defaults:
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
actor:
  model:
    model_type: gr00t_n1d6
    precision: fp32
    trust_remote_code: true
    is_lora: false
    action_dim: 8
    num_action_chunks: 32
    denoising_steps: 8
    obs_converter_type: arena_droid
    embodiment_tag: oxe_droid
    add_value_head: true
    train_last_blocks: 1
    rl_head_config:
      joint_logprob: false
      noise_method: flow_sde
      ignore_last: false
      safe_get_logprob: false
      noise_anneal: false
      noise_params:
      - 0.7
      - 0.3
      - 400
      noise_level: 0.3
      action_noise_scale: 0.0
      add_value_head: true
      chunk_critic_input: false
      detach_critic_input: true
      disable_dropout: true
      use_vlm_value: false
      value_vlm_mode: mean_token
      padding_value: 570
    num_steps: 4
    model_path: ${oc.env:LAB_ROOT}/models/GR00T-N1.6-DROID
    inference_micro_batch_size: 1
    no_split_modules:
    - EagleBackbone
    - BasicTransformerBlock
    - CategorySpecificMLP
    - ValueHead
    - TimestepEncoder
    - TimestepEmbedding
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: false
    use_liger_kernel: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: bf16
    wrappers: {}
    mixed_precision_policies: {}
    mixed_precision_rules: {}
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false
      init_scale: null
      growth_interval: null
    wrap_policy:
      transformer_layer_cls_to_wrap:
      - EagleBackbone
      - BasicTransformerBlock
      - CategorySpecificMLP
      - ValueHead
      - TimestepEncoder
      - TimestepEmbedding
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: ${int_div:${multiply:${env.train.total_num_envs},${int_div:${env.train.max_steps_per_rollout_epoch},${actor.model.num_action_chunks}}},6}
  seed: 1000
  enable_offload: true
  optim:
    lr: 2.5e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
weight_syncer:
  type: bucket
  bucket:
    bucket_size: 536870912
    bucket_dtype: null
    is_agent: false
    load_instant: true
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:LAB_ROOT}/logs/rl-training
    project_name: rlinf
    experiment_name: maple-table-blue-block-ppo-demo
    logger_backends:
    - tensorboard
  max_epochs: 3
  max_steps: 3
  only_eval: false
  val_check_interval: -1
  save_interval: 3
  resume_dir: null
  ckpt_path: null
  weight_sync_interval: 1
  per_worker_log: false
  per_worker_log_path: null
  overlap_env_bootstrap: false
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  clip_log_ratio_min: -20
  clip_log_ratio_max: 20
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  log_epoch_metrics: true
  audit_first_update: true
  log_logprob_diagnostics: true
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    use_rel_reward: false
    reward_coef: 1.0
    total_num_envs: 2
    viser_envs: 0
    group_size: 1
    max_episode_steps: 1056
    max_steps_per_rollout_epoch: 1056
    auto_reset: true
    env_type: isaaclab
    seed: 1000
    device: cuda:0
    ignore_terminations: false
    io_module: embodied_ai_lab.environments.droid_io
    arena:
      pick_up_object: blue_block_basic_robolab
      destination_location: wooden_bowl_hot3d_robolab
      embodiment: droid_abs_joint_pos
      hdr: home_office_robolab
      enable_cameras: true
      episode_length_s: 70.4
    init_params:
      id: Arena-v0
    video_cfg:
      save_video: false
    use_fixed_reset_state_ids: false
    is_eval: false
    task: pick_and_place_maple_table_rl
    external_environment_class_path: embodied_ai_lab.environments.maple_table:MapleTableRLEnvironment
    language_instruction: Pick up the blue block and place it in the bowl.
  eval:
    viser_envs: 0
    rollout_epoch: 1
    use_rel_reward: false
    total_num_envs: 2
    group_size: 1
    auto_reset: true
    ignore_terminations: false
    max_episode_steps: 1056
    max_steps_per_rollout_epoch: 1056
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    env_type: isaaclab
    seed: 2000
    device: cuda:0
    io_module: ${env.train.io_module}
    arena: ${env.train.arena}
    init_params:
      id: Arena-v0
    use_fixed_reset_state_ids: false
    task: ${env.train.task}
    external_environment_class_path: ${env.train.external_environment_class_path}
    language_instruction: ${env.train.language_instruction}
rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: bf16
reward:
  use_reward_model: false
critic:
  use_critic_model: false
