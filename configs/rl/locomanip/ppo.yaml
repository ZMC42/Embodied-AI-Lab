defaults:
- model/gr00t_n1d6@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer@weight_syncer: patch_syncer
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:LAB_ROOT}/logs/rl-training
    project_name: rlinf
    experiment_name: locomanip-ppo
    logger_backends:
    - tensorboard
  max_epochs: 2
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 2
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  clip_log_ratio_min: -20
  clip_log_ratio_max: 20
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: EnvGroup
  train:
    rollout_epoch: 1
    use_rel_reward: false
    reward_coef: 1.0
    total_num_envs: 2
    viser_envs: 0
    group_size: 1
    # Arena 30 s × 50 Hz；修改上限须同步映射到 Arena 任务配置。
    max_episode_steps: 1500
    max_steps_per_rollout_epoch: 1500
    # ArenaEnv 仅支持 auto_reset=true、ignore_terminations=false。
    auto_reset: true
    env_type: isaaclab
    seed: 1000
    device: cuda:0
    ignore_terminations: false
    io_module: embodied_ai_lab.environments.g1_io
    arena:
      object: brown_box
      destination: blue_sorting_bin
      embodiment: g1_wbc_joint
      enable_cameras: true
    init_params:
      id: Arena-v0
    video_cfg:
      save_video: false
    use_fixed_reset_state_ids: false
    is_eval: false
  eval:
    viser_envs: 0
    rollout_epoch: 1
    use_rel_reward: false
    total_num_envs: 2
    group_size: 1
    # ArenaEnv 仅支持 auto_reset=true、ignore_terminations=false。
    auto_reset: true
    ignore_terminations: false
    # Arena 30 s × 50 Hz；修改上限须同步映射到 Arena 任务配置。
    max_episode_steps: 1500
    max_steps_per_rollout_epoch: 1500
    is_eval: true
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval
    env_type: isaaclab
    seed: 2000
    device: cuda:0
    io_module: ${env.train.io_module}
    arena: ${env.train.arena}
    init_params:
      id: Arena-v0
    use_fixed_reset_state_ids: false
rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  # 环境数 × 每环境 rollout 动作块数，每个 update epoch 累计后更新一次。
  global_batch_size: ${multiply:${env.train.total_num_envs},${int_div:${env.train.max_steps_per_rollout_epoch},${actor.model.num_action_chunks}}}
  seed: 1000
  enable_offload: false
  model:
    model_path: ${oc.env:LAB_ROOT}/models/GR00T-N1.6-G1/checkpoint-20000
    model_type: gr00t_n1d6
    embodiment_tag: new_embodiment
    add_value_head: true
    num_action_chunks: 50
    action_dim: 35
    denoising_steps: 4
    no_split_modules:
    - EagleBackbone
    - BasicTransformerBlock
    - CategorySpecificMLP
    - ValueHead
    - TimestepEncoder
    - TimestepEmbedding
    obs_converter_type: arena_g1
    rl_head_config:
      noise_level: 0.3
      action_noise_scale: 0.0
    precision: fp32
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    wrap_policy:
      transformer_layer_cls_to_wrap: ${actor.model.no_split_modules}
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
reward:
  use_reward_model: false
critic:
  use_critic_model: false
